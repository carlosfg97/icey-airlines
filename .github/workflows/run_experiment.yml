name: Run experiment

on:
  # No GitHub cron on purpose: it fired irregularly in this repo. The hourly trigger is an external
  # cron-job.org job that calls workflow_dispatch (minute 7, is_test=false, batches=1).
  workflow_dispatch:             # manual "Run workflow" button
    inputs:
      is_test:
        description: "Test run (flagged is_test, saves raw responses, excluded from analysis)"
        type: boolean
        default: true
      limit:
        description: "Max calls PER BATCH. Leave empty for a full batch (36). In test mode empty means 12."
        type: string
        default: ""
      batches:
        description: "Real runs only: how many consecutive batches to run in one go (1-8, 36 calls each)"
        type: string
        default: "6"

# Never let two runs overlap (they would race on data/results.jsonl).
concurrency:
  group: experiment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Only manual / API dispatches run this job. To pause the hourly external trigger, disable the
    # cron-job.org job (or revoke its token).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-run.txt

      - run: pip install -r requirements-run.txt pandas

      - name: Unit tests
        # A failing test must never block data collection; it shows up as a warning in the log.
        continue-on-error: true
        run: python -m unittest discover -s tests -t .

      - name: Run experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.is_test }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
          BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.batches || '' }}
        run: |
          # Inputs must be plain numbers (they end up on a command line).
          for v in "$LIMIT" "$BATCHES"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+$ ]]; then echo "Bad numeric input: $v" >&2; exit 1; fi
          done
          ARGS=""
          if [ "$IS_TEST" = "true" ]; then
            ARGS="--test --limit ${LIMIT:-12}"
          else
            if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
            if [ -n "$BATCHES" ]; then ARGS="$ARGS --batches $BATCHES"; fi
          fi
          echo "Running: python -m src.run $ARGS"
          python -m src.run $ARGS

      - name: Summary of captured URLs
        if: always()
        run: |
          {
            echo "### Cited URL categories and top domains"
            echo '```'
            python -m src.classify data/results.jsonl || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: always()
        run: |
          git config user.name "experiment-bot"
          git config user.email "experiment-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "data: run ${GITHUB_RUN_NUMBER} (${GITHUB_EVENT_NAME})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          echo "Push failed after retries" >&2; exit 1
